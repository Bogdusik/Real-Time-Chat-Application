spring.application.name=chat

# Every value can be set through the environment variable in ${...}; the defaults suit a local run.
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chatdb}
spring.datasource.username=${DB_USERNAME:chatuser}
spring.datasource.password=${DB_PASSWORD:chatpass}

# Hibernate creates and updates the two tables (message, "user"); there are no migration scripts.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

chat.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
